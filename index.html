<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sushi Master</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sushi Master">
<link rel="apple-touch-icon" href="nigiri.png">

<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        text-align: center;
        background-color: #fdf2f2;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        overflow: hidden; /* Evita rebote en móvil */
    }

    .container {
        background: white;
        padding: 40px; 
        border-radius: 30px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        width: 85%; /* Ajuste para móviles */
        max-width: 320px;
    }

    h1 {
        font-size: 28px;
        margin-bottom: 5px;
        background: linear-gradient(45deg, #d32f2f, #ff5252);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 800;
    }

    #count {
        font-size: 72px; 
        font-weight: 900;
        color: #2d3436;
        margin: 10px 0;
    }

    .sushi-wrapper {
        perspective: 1000px;
        margin-top: 80px; 
        margin-bottom: 30px;
    }

    .sushi {
        width: 140px; 
        height: auto;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent; /* Quita el cuadro azul al tocar en móvil */
        filter: drop-shadow(0 10px 10px rgba(0,0,0,0.05));
    }

    .jump {
        animation: jump-animation 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes jump-animation {
        0%   { transform: translateY(0); }
        50%  { transform: translateY(-60px) scale(1.1); }
        100% { transform: translateY(0); }
    }

    .controls {
        display: flex;
        gap: 15px;
    }

    button {
        flex: 1;
        font-size: 14px;
        font-weight: bold;
        padding: 15px;
        cursor: pointer;
        border: none;
        border-radius: 15px;
        background-color: #f1f2f6;
        color: #57606f;
    }

    .btn-reset {
        background-color: #ffeaa7;
        color: #d35400;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Sushi Master</h1>
    <div id="count">0</div>
    <div class="sushi-wrapper">
        <img src="nigiri.png" class="sushi" id="nigiri" alt="Nigiri">
    </div>
    <div class="controls">
        <button id="minus"> - 1 </button>
        <button class="btn-reset" id="reset">Reset</button>
    </div>
</div>

<script>
    let count = 0;
    const countDisplay = document.getElementById("count");
    const nigiri = document.getElementById("nigiri");
    const minus = document.getElementById("minus");
    const reset = document.getElementById("reset");

    function update() { countDisplay.textContent = count; }

    nigiri.addEventListener("click", () => {
        count++;
        update();
        nigiri.classList.remove("jump");
        void nigiri.offsetWidth; 
        nigiri.classList.add("jump");
    });

    minus.addEventListener("click", () => { if (count > 0) { count--; update(); } });
    reset.addEventListener("click", () => { count = 0; update(); });
</script>
</body>
</html>
